name: release

# Push a tag like v0.1.0. Builds five binaries, publishes a GitHub release with
# checksums and build provenance, then the npm packages and the crate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { npm: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { npm: darwin-x64, target: x86_64-apple-darwin, os: macos-latest }
          - { npm: linux-x64, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { npm: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { npm: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      NPM_TARGET: ${{ matrix.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET"
      - name: Stage binary
        shell: bash
        run: |
          ext=""
          [ "$NPM_TARGET" = win32-x64 ] && ext=".exe"
          mkdir -p dist
          cp "target/$TARGET/release/permlock$ext" "dist/permlock-$NPM_TARGET$ext"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: permlock-${{ matrix.npm }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Create this environment in the repo settings to require a manual approval.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    # npm and crates.io trust this workflow and this environment, so no tokens are stored.
    # Every step below skips work that is already done, so a failed run can be rerun.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          npm_version=$(node -p "require('./npm/permlock/package.json').version")
          action_version=$(sed -n 's/^    default: "\([0-9][0-9.]*\)"$/\1/p' action.yml)
          echo "tag $tag, cargo $cargo_version, npm $npm_version, action $action_version"
          test "$tag" = "$cargo_version" && test "$tag" = "$npm_version" && test "$tag" = "$action_version"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum permlock-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/permlock-*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>/dev/null \
            || gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Move the v0 tag for the GitHub Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA"
      - name: Publish to npm
        run: |
          # Trusted publishing needs npm 11.5.1 or newer.
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm -v)" \
            || { echo "npm $(npm -v) is too old for trusted publishing"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          publish() {
            name=$(node -p "require('$1/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>/dev/null; then
              echo "already on npm: $name@$version"
            else
              npm publish "$1" --provenance --access public
            fi
          }
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            ext=""
            [ "$target" = win32-x64 ] && ext=".exe"
            bash scripts/npm-platform.sh "$target" "$version" "dist/permlock-$target$ext" "npm-out/$target"
            publish "./npm-out/$target"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE npm/permlock/
          publish ./npm/permlock
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sf -A "permlock-release (github.com/alii13/permlock)" "https://crates.io/api/v1/crates/permlock/$version" >/dev/null; then
            echo "already on crates.io: permlock@$version"
          else
            rustup toolchain install stable --profile minimal
            cargo publish --locked
          fi
